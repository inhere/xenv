name: Unit-Tests
on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - '**.go'
      - '**.yml'
  push:
    branches: # Only trigger branch pushes; tag pushes are ignored.
      - '**'
    paths:
      - 'go.mod'
      - 'go.sum'
      - '**.go'
      - '**.yml'

jobs:

  test:
    name: Test on go ${{ matrix.go_version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go_version: [1.25, stable]
        include:
          # macOS only needs one leg; it guards the darwin specific paths
          - os: macos-latest
            go_version: stable

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Setup Go Faster
      uses: WillAbides/setup-go-faster@v1.19.0
      timeout-minutes: 3
      with:
        go-version: ${{ matrix.go_version }}

    - name: Check gofmt
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.go_version == 'stable' }}
      shell: bash
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "gofmt required for:"
          echo "$unformatted"
          exit 1
        fi

    - name: Run go vet
      shell: bash
      run: go vet ./...

    - name: Run staticcheck
      uses: reviewdog/action-staticcheck@v1
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.go_version == 'stable' }}
      with:
        github_token: ${{ secrets.github_token }}
        # Change reviewdog reporter if you need [github-pr-check,github-check,github-pr-review].
        reporter: github-check
        # Report all results. [added,diff_context,file,nofilter].
        filter_mode: added
        # Exit with 1 when it finds at least one finding.
        fail_level: 'error'

    - name: Mod tidy
      shell: bash
      run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum

    - name: Run unit tests
      # run: go test -v -cover ./...
      # must add " for profile.cov on Windows OS
      run: |
        go test -coverprofile="profile.cov" ./...
